<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solicitar Crédito - CreditSmart</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="solicitar-page">
  <!-- Encabezado -->
  <header class="site-header">
    <div class="container header-inner">
      <h1 class="brand">💳 CreditSmart</h1>
      <nav class="main-nav">
        <a href="index.html">Inicio</a>
        <a href="simulador.html">Simulador</a>
        <a href="solicitar.html" class="btn-primary">Solicitar Crédito</a>
      </nav>
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="container">
    <section class="hero">
      <h2>Formulario de Solicitud de Crédito</h2>
      <p>Completa tus datos personales y financieros para iniciar el proceso.</p>
    </section>

    <!-- Formulario -->
    <form class="credit-form">
  <h3><i class="fas fa-user"></i> Datos Personales</h3>

  <div class="form-section">
    <div class="form-group">
      <label>Nombre completo:</label>
      <input type="text" placeholder="Ejemplo: Vanessa Moncada">
    </div>

    <div class="form-group">
      <label>Tipo de documento:</label>
      <select>
        <option>Seleccione...</option>
        <option>Cédula de ciudadanía</option>
        <option>Cédula de extranjería</option>
        <option>Pasaporte</option>
      </select>
    </div>

    <div class="form-group">
      <label>Número de documento:</label>
      <input type="text" placeholder="Ejemplo: 1002456789">
    </div>

    <div class="form-group">
      <label>Fecha de nacimiento:</label>
      <input type="date">
    </div>

    <div class="form-group">
      <label>Dirección:</label>
      <input type="text" placeholder="Ejemplo: Calle 123 #45-67">
    </div>

    <div class="form-group">
      <label>Departamento:</label>
      <select>
        <option>Seleccione...</option>
        <option>Antioquia</option>
        <option>Cundinamarca</option>
        <option>Valle del Cauca</option>
      </select>
    </div>

    <div class="form-group">
      <label>Ciudad:</label>
      <input type="text" placeholder="Ejemplo: Bogotá">
    </div>

    <div class="form-group">
      <label>Teléfono:</label>
      <input type="text" placeholder="Ejemplo: 3001234567">
    </div>

    <div class="form-group">
      <label>Correo electrónico:</label>
      <input type="email" placeholder="Ejemplo: correo@ejemplo.com">
    </div>

    <div class="form-group">
      <label>Estado civil:</label>
      <select>
        <option>Seleccione...</option>
        <option>Soltero(a)</option>
        <option>Casado(a)</option>
        <option>Unión libre</option>
        <option>Divorciado(a)</option>
      </select>
    </div>
  </div>

  <h3><i class="fas fa-credit-card"></i> Información del Crédito</h3>

  <div class="form-section">
    <div class="form-group">
      <label>Tipo de crédito:</label>
      <select>
        <option>Seleccione una opción</option>
        <option>Libre inversión</option>
        <option>Vivienda</option>
        <option>Vehículo</option>
      </select>
    </div>

    <div class="form-group">
      <label>Monto solicitado:</label>
      <input type="number" placeholder="Ejemplo: 5000000">
    </div>

    <div class="form-group">
      <label>Ingreso mensual:</label>
      <input type="number" placeholder="Ejemplo: 2500000">
    </div>
  </div>

  <button type="submit">Enviar Solicitud</button>
</form>
